name: Insecure CI (demo — do not run)

on:
  pull_request_target:            # VULN-02: pwn-request (secrets + untrusted PR code)
    branches: [ "main" ]

permissions: write-all            # VULN-04: over-broad token scope

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4  # VULN-02: checks out untrusted PR head
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: some-org/some-action@main   # VULN-03: unpinned third-party action

      # VULN-01: untrusted PR title interpolated into the shell
      - run: echo "Building PR: ${{ github.event.pull_request.title }}"

      # VULN-05: secret echoed to the log
      - run: echo "token is ${{ secrets.DEPLOY_TOKEN }}"

      # VULN-06: unverified remote installer piped to bash
      - run: curl -sSL https://example.com/install.sh | bash
